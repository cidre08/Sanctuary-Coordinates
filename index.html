<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイクラ座標メモ帳</title>

  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="icon" type="image/png" href="./icon.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1b1918;
            color: #f0ebe4;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .custom-card {
            background-color: #262321;
            border: 1px solid #383431;
        }
        .custom-input {
            background-color: #1b1918;
            border: 1px solid #383431;
            color: #f0ebe4;
        }
        .custom-input:focus {
            border-color: #a3b19b;
            outline: none;
        }
        .custom-btn {
            background-color: #a3b19b;
            color: #1b1918;
            transition: background-color 0.2s;
        }
        .custom-btn:hover {
            background-color: #8da085;
        }
        .sub-btn {
            background-color: #312e2c;
            color: #d4c5b9;
            border: 1px solid #383431;
            transition: background-color 0.2s;
        }
        .sub-btn:hover {
            background-color: #3d3936;
        }
        .cancel-btn {
            background-color: #443e3b;
            color: #f0ebe4;
        }
        .cancel-btn:hover {
            background-color: #574f4b;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-3xl mx-auto">
        <header class="mb-6 text-center">
            <h1 class="text-3xl font-bold text-[#d4c5b9] mb-1">🌿 Sanctuary Coordinates</h1>
            <p class="text-[#a39b94] text-sm mb-4">Java版マインクラフト 座標管理メモ</p>
            
            <!-- バックアップ・インポートボタン -->
            <div class="flex justify-center gap-2">
                <button onclick="exportData()" class="sub-btn text-xs px-3 py-1.5 rounded-lg flex items-center gap-1">
                    <span>💾</span> バックアップ保存
                </button>
                <button onclick="document.getElementById('importFile').click()" class="sub-btn text-xs px-3 py-1.5 rounded-lg flex items-center gap-1">
                    <span>📂</span> データを読込
                </button>
                <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
            </div>
        </header>

        <!-- 現在地設定（距離計算用） -->
        <div class="custom-card p-4 rounded-xl mb-6 flex flex-col md:flex-row items-center justify-between gap-3 text-sm">
            <div class="flex items-center gap-2 text-[#d4c5b9]">
                <span>📍</span>
                <span class="font-medium">距離計算用の現在地設定:</span>
            </div>
            <div class="flex items-center gap-2 font-mono">
                <div class="flex items-center gap-1">
                    <span class="text-xs text-[#a39b94]">X:</span>
                    <input type="number" id="currentX" placeholder="0" oninput="updateDistances()" class="custom-input w-20 px-2 py-1 rounded text-xs">
                </div>
                <div class="flex items-center gap-1">
                    <span class="text-xs text-[#a39b94]">Z:</span>
                    <input type="number" id="currentZ" placeholder="0" oninput="updateDistances()" class="custom-input w-20 px-2 py-1 rounded text-xs">
                </div>
                <button onclick="clearCurrentPos()" class="sub-btn text-xs px-2 py-1 rounded">クリア</button>
            </div>
        </div>

        <!-- 入力・編集フォーム -->
        <div class="custom-card p-6 rounded-2xl shadow-xl mb-8">
            <h2 id="formTitle" class="text-xl font-semibold mb-4 text-[#d4c5b9] flex items-center gap-2">
                <span>📍</span> 新しい場所を記録する
            </h2>
            <form id="coordForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <!-- 座標一括ペースト機能 ＆ ヒント -->
                <div class="md:col-span-2 bg-[#1b1918] p-3.5 rounded-xl border border-[#383431]">
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-medium text-[#a39b94]">✨ 座標をここにコピペ（自動でXYZに振り分けられます）</label>
                        <span class="text-[11px] text-[#a39b94]/70 bg-[#262321] px-2 py-0.5 rounded border border-[#383431]">💡 F3 + C を3秒長押しでコピー可</span>
                    </div>
                    <input type="text" id="pasteCoord" placeholder="例: /tp 100 64 -200 または 100 64 -200" 
                        class="w-full custom-input rounded-lg px-3 py-2 text-sm font-mono">
                </div>

                <div>
                    <label class="block text-sm font-medium text-[#d4c5b9] mb-1">絵文字 & 場所の名前</label>
                    <div class="flex gap-2">
                        <select id="emoji" class="custom-input rounded-lg px-2 py-2 text-lg">
                            <option value="🏡">🏡</option>
                            <option value="☕">☕</option>
                            <option value="🍞">🍞</option>
                            <option value="🌷">🌷</option>
                            <option value="🍯">🍯</option>
                            <option value="🌙">🌙</option>
                            <option value="🕯️">🕯️</option>
                            <option value="🗝️">🗝️</option>
                            <option value="🌋">🌋</option>
                            <option value="🛡️">🛡️</option>
                            <option value="🏰">🏰</option>
                            <option value="💀">💀</option>
                            <option value="💎">💎</option>
                            <option value="🌾">🌾</option>
                            <option value="⛏️">⛏️</option>
                            <option value="⭐">⭐</option>
                        </select>
                        <input type="text" id="name" required placeholder="例: メイン拠点" 
                            class="w-full custom-input rounded-lg px-3 py-2 text-white">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-[#d4c5b9] mb-1">ディメンション</label>
                    <select id="dimension" class="custom-input w-full rounded-lg px-2.5 py-2">
                        <option value="overworld">オーバーワールド (通常世界)</option>
                        <option value="nether">ネザー</option>
                        <option value="end">ジ・エンド</option>
                    </select>
                </div>

                <div class="grid grid-cols-3 gap-2 md:col-span-2">
                    <div>
                        <label class="block text-xs font-medium text-[#a39b94] mb-1">X 座標</label>
                        <input type="number" id="x" required placeholder="0" 
                            class="w-full custom-input rounded-lg px-3 py-2 font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-[#a39b94] mb-1">Y 座標</label>
                        <input type="number" id="y" required placeholder="64" 
                            class="w-full custom-input rounded-lg px-3 py-2 font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-[#a39b94] mb-1">Z 座標</label>
                        <input type="number" id="z" required placeholder="0" 
                            class="w-full custom-input rounded-lg px-3 py-2 font-mono">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-[#d4c5b9] mb-1">タグ (カンマ区切り)</label>
                    <input type="text" id="tags" placeholder="例: 拠点, 村, 司書" 
                        class="w-full custom-input rounded-lg px-3 py-2 text-sm">
                </div>

                <div>
                    <label class="block text-sm font-medium text-[#d4c5b9] mb-1">メモ (任意)</label>
                    <input type="text" id="memo" placeholder="例: 安全ルート確保済み" 
                        class="w-full custom-input rounded-lg px-3 py-2 text-sm">
                </div>

                <div class="md:col-span-2 flex gap-2">
                    <button type="submit" id="submitBtn" class="custom-btn flex-1 font-bold py-2.5 px-4 rounded-xl shadow-md">
                        リストに追加する
                    </button>
                    <button type="button" id="cancelEditBtn" class="cancel-btn px-4 py-2.5 rounded-xl text-sm hidden" onclick="cancelEdit()">
                        キャンセル
                    </button>
                </div>
            </form>
        </div>

        <!-- 一覧表示セクション -->
        <div>
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-4">
                <h2 class="text-xl font-semibold text-[#d4c5b9]">記録した座標一覧</h2>
                <div class="flex gap-2 w-full md:w-auto">
                    <select id="filterDim" class="custom-input rounded-lg px-3 py-1.5 text-sm text-[#f0ebe4] flex-1 md:flex-initial">
                        <option value="all">すべてのディメンション</option>
                        <option value="overworld">オーバーワールド</option>
                        <option value="nether">ネザー</option>
                        <option value="end">ジ・エンド</option>
                    </select>
                </div>
            </div>
            <div id="coordList" class="space-y-3">
                <!-- JavaScriptでここにリストが挿入されます -->
            </div>
        </div>
    </div>

    <script>
        let coords = JSON.parse(localStorage.getItem('minecraft_coords_v5')) || [];
        let editingId = null;

        const form = document.getElementById('coordForm');
        const coordList = document.getElementById('coordList');
        const filterDim = document.getElementById('filterDim');
        const pasteInput = document.getElementById('pasteCoord');
        const formTitle = document.getElementById('formTitle');
        const submitBtn = document.getElementById('submitBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');

        const dimNames = {
            overworld: { name: 'オーバーワールド', class: 'bg-[#313831] text-[#b3c9b0] border-[#424d41]' },
            nether: { name: 'ネザー', class: 'bg-[#403030] text-[#d4abab] border-[#594242]' },
            end: { name: 'ジ・エンド', class: 'bg-[#363040] text-[#c7b5d9] border-[#4a4159]' }
        };

        function formatDateTime(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            const h = String(date.getHours()).padStart(2, '0');
            const min = String(date.getMinutes()).padStart(2, '0');
            return `${y}/${m}/${d} ${h}:${min}`;
        }

        pasteInput.addEventListener('input', (e) => {
            const text = e.target.value;
            const matches = text.match(/-?\d+/g);
            if (matches && matches.length >= 3) {
                document.getElementById('x').value = matches[0];
                document.getElementById('y').value = matches[1];
                document.getElementById('z').value = matches[2];
            }
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const emoji = document.getElementById('emoji').value;
            const name = document.getElementById('name').value;
            const dimension = document.getElementById('dimension').value;
            const x = parseInt(document.getElementById('x').value);
            const y = parseInt(document.getElementById('y').value);
            const z = parseInt(document.getElementById('z').value);
            const tagsInput = document.getElementById('tags').value;
            const tags = tagsInput ? tagsInput.split(',').map(t => t.trim()).filter(t => t) : [];
            const memo = document.getElementById('memo').value;

            if (editingId !== null) {
                coords = coords.map(c => {
                    if (c.id === editingId) {
                        return { ...c, emoji, name, dimension, x, y, z, tags, memo };
                    }
                    return c;
                });
                cancelEdit();
            } else {
                const newCoord = {
                    id: Date.now(),
                    createdAt: new Date().toISOString(),
                    emoji, name, dimension, x, y, z, tags, memo
                };
                coords.unshift(newCoord);
            }

            saveAndRender();
            form.reset();
            pasteInput.value = '';
        });

        function editCoord(id) {
            const target = coords.find(c => c.id === id);
            if (!target) return;

            editingId = id;
            document.getElementById('emoji').value = target.emoji || '🏡';
            document.getElementById('name').value = target.name;
            document.getElementById('dimension').value = target.dimension;
            document.getElementById('x').value = target.x;
            document.getElementById('y').value = target.y;
            document.getElementById('z').value = target.z;
            document.getElementById('tags').value = target.tags ? target.tags.join(', ') : '';
            document.getElementById('memo').value = target.memo || '';

            formTitle.innerHTML = `<span>✏️</span> 「${escapeHtml(target.name)}」を編集中`;
            submitBtn.textContent = '変更を保存する';
            cancelEditBtn.classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            editingId = null;
            form.reset();
            pasteInput.value = '';
            formTitle.innerHTML = `<span>📍</span> 新しい場所を記録する`;
            submitBtn.textContent = 'リストに追加する';
            cancelEditBtn.classList.add('hidden');
        }

        function deleteCoord(id) {
            if (confirm('この場所を削除してもよろしいですか？')) {
                if (editingId === id) {
                    cancelEdit();
                }
                coords = coords.filter(c => c.id !== id);
                saveAndRender();
            }
        }

        function copyCommand(x, y, z) {
            const cmd = `/tp ${x} ${y} ${z}`;
            navigator.clipboard.writeText(cmd).then(() => {
                alert(`コマンドをコピーしました: ${cmd}`);
            });
        }

        function clearCurrentPos() {
            document.getElementById('currentX').value = '';
            document.getElementById('currentZ').value = '';
            renderList();
        }

        function updateDistances() {
            renderList();
        }

        // エクスポート（バックアップ保存）
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(coords, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "minecraft_coords_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // インポート（データ読込）
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        coords = imported;
                        saveAndRender();
                        alert('データを正常に読み込みました！');
                    } else {
                        alert('ファイルの形式が正しくありません。');
                    }
                } catch (err) {
                    alert('JSONファイルの読み込みに失敗しました。');
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // リセット
        }

        function saveAndRender() {
            localStorage.setItem('minecraft_coords_v5', JSON.stringify(coords));
            renderList();
        }

        function renderList() {
            const filter = filterDim.value;
            coordList.innerHTML = '';

            const curX = parseFloat(document.getElementById('currentX').value);
            const curZ = parseFloat(document.getElementById('currentZ').value);
            const hasCurrentPos = !isNaN(curX) && !isNaN(curZ);

            const filtered = coords.filter(c => filter === 'all' || c.dimension === filter);

            if (filtered.length === 0) {
                coordList.innerHTML = `<div class="text-center text-[#a39b94] py-12 custom-card rounded-2xl">まだ記録された場所はありません</div>`;
                return;
            }

            filtered.forEach(c => {
                const dimInfo = dimNames[c.dimension];
                
                let convertedText = '';
                if (c.dimension === 'overworld') {
                    const nx = Math.round(c.x / 8);
                    const nz = Math.round(c.z / 8);
                    convertedText = `<span class="text-xs text-[#d4abab] ml-2">🔀 ネザー: X:${nx}, Z:${nz}</span>`;
                } else if (c.dimension === 'nether') {
                    const ox = c.x * 8;
                    const oz = c.z * 8;
                    convertedText = `<span class="text-xs text-[#b3c9b0] ml-2">🔀 通常: X:${ox}, Z:${oz}</span>`;
                }

                // 距離計算
                let distanceText = '';
                if (hasCurrentPos) {
                    const dist = Math.round(Math.sqrt(Math.pow(c.x - curX, 2) + Math.pow(c.z - curZ, 2)));
                    distanceText = `<span class="text-xs text-[#a39b94] ml-2">📏 約 ${dist}ブロック</span>`;
                }

                const timeText = c.createdAt ? `<span class="text-xs text-[#a39b94]/70 ml-2">🕒 ${formatDateTime(c.createdAt)}</span>` : '';

                // タグ表示の生成
                let tagsHtml = '';
                if (c.tags && c.tags.length > 0) {
                    tagsHtml = `<div class="flex flex-wrap gap-1 mt-1.5">` + 
                        c.tags.map(t => `<span class="text-[11px] bg-[#312e2c] text-[#d4c5b9] px-2 py-0.5 rounded-md border border-[#3f3a37]">#${escapeHtml(t)}</span>`).join('') + 
                        `</div>`;
                }

                const card = document.createElement('div');
                card.className = `custom-card p-4 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4`;
                card.innerHTML = `
                    <div>
                        <div class="flex items-center gap-2 mb-1 flex-wrap">
                            <span class="text-xl">${c.emoji || '📍'}</span>
                            <span class="font-bold text-base text-white">${escapeHtml(c.name)}</span>
                            <span class="text-xs px-2 py-0.5 rounded border ${dimInfo.class}">${dimInfo.name}</span>
                            ${timeText}
                        </div>
                        <div class="text-[#d4c5b9] font-mono text-sm mb-1">
                            X: ${c.x}, Y: ${c.y}, Z: ${c.z} ${convertedText} ${distanceText}
                        </div>
                        ${tagsHtml}
                        ${c.memo ? `<p class="text-[#a39b94] text-sm mt-1">📝 ${escapeHtml(c.memo)}</p>` : ''}
                    </div>
                    <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                        <button onclick="copyCommand(${c.x}, ${c.y}, ${c.z})" class="bg-[#3b443c] hover:bg-[#485449] text-[#f0ebe4] text-xs px-3 py-2 rounded-lg transition">
                            /tp コピー
                        </button>
                        <button onclick="editCoord(${c.id})" class="bg-[#423d38] hover:bg-[#57504a] text-[#f0ebe4] text-xs px-3 py-2 rounded-lg transition">
                            編集
                        </button>
                        <button onclick="deleteCoord(${c.id})" class="bg-[#473636] hover:bg-[#5c4444] text-[#d4abab] text-xs px-3 py-2 rounded-lg transition border border-[#5e4545]">
                            削除
                        </button>
                    </div>
                `;
                coordList.appendChild(card);
            });
        }

        function escapeHtml(str) {
            return str.replace(/[&'`"<>]/g, function(match) {
                return {
                    '&': '&amp;',
                    "'": '&#x27;',
                    '`': '&#x60;',
                    '"': '&quot;',
                    '<': '&lt;',
                    '>': '&gt;',
                }[match];
            });
        }

        filterDim.addEventListener('change', renderList);

        renderList();
    </script>
</body>
</html>
